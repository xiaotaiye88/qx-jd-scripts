# 极氪 (ZeekrLife) 自动签到 (Quantumult X 资源订阅)
# 订阅: https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/zeekr_scripts.conf
# 功能: 打开 App 自动抓 Token + 每天 9:30 定时签到/领任务奖励/收集能量球
#
# Token 存放（圈X原生存储，键 zeekr_tokens / zeekr_token）：
#   查看/复制两种方式：
#   1) BoxJs → 添加应用订阅
#      https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/boxjs/qx-jd.boxjs.json
#      刷新后进入「极氪签到」应用，复制 zeekr_tokens 的值
#   2) 圈X → 风车 → 工具 → 日志，搜索 [ZEEKR][TOKEN]，长按复制该行

[rewrite_local]
# 抓取 Token：任何 api-gw-toc.zeekrlife.com 请求都会触发（不限于签到页）
# 抓到后（收到「Token 已保存」通知）可注释掉本行
^https?:\/\/api-gw-toc\.zeekrlife\.com\/ url script-request-header https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/scripts/zeekr_checkin.qx.js?v=v202611251710

[task_local]
# 极氪每日签到（每天 9:30）
30 9 * * * https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/scripts/zeekr_checkin.qx.js?v=v202611251710, tag=极氪签到, img-url=https://raw.githubusercontent.com/Sliverkiss/QuantumultX/main/icon/zeekr.png, enabled=true

[mitm]
hostname = api-gw-toc.zeekrlife.com
