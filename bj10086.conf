# 北京移动签到 + 网龄成长计划 (Quantumult X 资源订阅)
# 订阅: https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/bj10086.conf
# 详解: https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/bj10086.README.md

[rewrite_local]
# 签到: 捕获活动token/constid（uniTokenValidateH5 的响应里换正式 token）
^https?://h5\.bj\.10086\.cn/(ActivityUnifyLogin|ActSignIn2023)/ url script-request-header https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/bj10086.js
^https?://h5\.bj\.10086\.cn/ActivityUnifyLogin/uniTokenValidateH5 url script-response-body https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/bj10086.js

# 网龄: 捕获 User-Token；loginCheck 响应里拿 userId/手机号
^https?://dev\.coc\.10086\.cn/coc/(user/loginCheck|activities|web6/ageFeedbackV2) url script-request-header https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/bj10086.js
^https?://dev\.coc\.10086\.cn/coc/user/loginCheck url script-response-body https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/bj10086.js

[mitm]
hostname = h5.bj.10086.cn, dev.coc.10086.cn
