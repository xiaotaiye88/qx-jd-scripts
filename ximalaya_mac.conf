^https?:\/\/mobwsa\.ximalaya\.com\/mobile-playpage\/track\/v3\/baseInfo url script-response-body https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/ximalaya_mac.js?v=10
^https?:\/\/pc\.ximalaya\.com\/simple-revision-for-pc\/play\/v1\/audio url script-response-body https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/ximalaya_mac.js?v=10
# Mac 购买弹窗接口: 直接拒绝
^https?:\/\/pc\.ximalaya\.com\/simple-revision-for-pc\/bdsp\/album\/pay\/schema url reject
