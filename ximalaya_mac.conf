# ============================================
# 喜马拉雅 Mac 客户端 (Electron) 会员解锁 — Quantumult X 资源订阅配置
# 仓库: https://github.com/xiaotaiye88/qx-jd-scripts
# 订阅地址(复制到 QX 配置-资源订阅-rewrite):
# https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/ximalaya_mac.conf
#
# 使用说明:
#   1. Quantumult X → 设置 → 配置文件 → 资源订阅 → 添加 rewrite 订阅
#      粘贴上面的订阅地址, 类型选 rewrite
#   2. 确保 MitM 已开启且已安装/信任 QX 证书
#   3. 重新加载配置后, 打开喜马拉雅 Mac 客户端播放 VIP 音频即可
#
# 原理:
#   Mac 客户端走 PC 接口 (www.ximalaya.com/mobile-playpage/track/v3/baseInfo
#   和 pc.ximalaya.com/simple-revision-for-pc/play/v1/audio)。
#   ximalaya_mac.js 动态加载 ximalaya.js 解析引擎, 复用共享会员 Cookie
#   解析出真实 VIP 音频 URL 并改写进 Mac 端响应。
# ============================================

[rewrite_local]
# > 喜马拉雅 Mac 客户端会员解锁适配
# 核心: 请求头注入共享会员 Cookie(让服务器直接返回可播放src, 无需慢速解析)
^https?:\/\/pc\.ximalaya\.com\/simple-revision-for-pc\/play\/v1\/audio url script-request-header https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/ximalaya_mac.js?v=10
^https?:\/\/www\.ximalaya\.com\/mobile-playpage\/track\/v3\/baseInfo url script-request-header https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/ximalaya_mac.js?v=10
^https?:\/\/mobile\.ximalaya\.com\/mobile-playpage\/track\/v3\/baseInfo url script-request-header https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/ximalaya_mac.js?v=10
^https?:\/\/mobwsa\.ximalaya\.com\/mobile-playpage\/track\/v3\/baseInfo url script-request-header https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/ximalaya_mac.js?v=10
# 响应改写
^https?:\/\/pc\.ximalaya\.com\/simple-revision-for-pc\/track\/simple url script-response-body https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/ximalaya_mac.js?v=10
^https?:\/\/www\.ximalaya\.com\/mobile-playpage\/track\/v3\/baseInfo url script-response-body https://raw.githubusercontent.com/xiaotaiye88/qx-jd-scripts/master/ximalaya_mac.js?v=10
